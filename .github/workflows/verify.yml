name: Verify

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install repository check tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq ripgrep shellcheck

      - name: Create CI configuration
        run: |
          cp .env.example .env
          sed -i 's/^PUBLIC_HTTP_PORT=.*/PUBLIC_HTTP_PORT=18080/' .env
          sed -i 's/^PUBLIC_HTTPS_PORT=.*/PUBLIC_HTTPS_PORT=18443/' .env
          mkdir -p .secrets
          printf '%s\n' 'olc_ci' >.secrets/rpc_user
          printf '%s\n' '0123456789abcdef0123456789abcdef' >.secrets/rpc_password
          chmod 0600 .env .secrets/rpc_user .secrets/rpc_password

      - name: Run repository checks
        run: make check

      - name: Check shell scripts
        run: shellcheck node/entrypoint.sh deploy/*.sh scripts/*.sh tests/*.test.sh

      - name: Render the Compose model
        run: docker compose --env-file .env config --quiet

      - name: Validate the gateway configuration
        run: |
          docker run --rm \
            --env CADDY_SITE=:80 \
            --volume "$PWD/gateway/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648 \
            caddy validate --config /etc/caddy/Caddyfile
          docker run --rm \
            --env CADDY_SITE=wallet.example.com \
            --volume "$PWD/gateway/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648 \
            caddy validate --config /etc/caddy/Caddyfile

      - name: Build the node image
        run: docker compose --env-file .env build --pull node

      - name: Check the node image
        run: |
          set -a
          source .env
          set +a
          docker inspect --format '{{.Config.User}}' "organiclifecoin/node:${NODE_RELEASE}" | grep -Fx organiclife
          docker run --rm --entrypoint organiclifed "organiclifecoin/node:${NODE_RELEASE}" --version

      - name: Pull the gateway image
        run: docker compose --env-file .env pull gateway

      - name: Build the RPC bridge image
        run: docker compose --env-file .env build --pull rpc-bridge

      - name: Build the wallet image
        run: |
          set -o pipefail
          if ! docker compose --env-file .env build --pull --progress plain wallet 2>&1 | tee wallet-build.log; then
            tail -80 wallet-build.log | sed 's/^/::error title=Wallet image build::/'
            exit 1
          fi

      - name: Build the Blockbook image
        run: docker compose --env-file .env build --pull blockbook

      - name: Start and check the complete stack
        run: |
          set -o pipefail
          if ! docker compose --env-file .env up -d --wait --wait-timeout 300 2>&1 | tee stack-start.log; then
            docker compose --env-file .env ps --all 2>&1 | tee -a stack-start.log
            docker compose --env-file .env logs --no-color --tail=120 2>&1 | tee -a stack-start.log
            tail -200 stack-start.log | sed 's/^/::error title=Stack startup::/'
            exit 1
          fi
          docker compose --env-file .env exec -T gateway wget --quiet --output-document=- http://127.0.0.1/healthz
          docker compose --env-file .env exec -T gateway wget --quiet --output-document=/dev/null http://127.0.0.1/api/v2

      - name: Clean the CI stack
        if: always()
        run: docker compose --env-file .env down --volumes --remove-orphans
